[package]
name = "bloom-signing"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Signs and verifies Bloom plugins (Ed25519 signature over a content digest)."

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
